[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-framework"
version = "0.1.0"
description = "Hypothesis-driven workflow fuzzing framework for stateful web applications."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "Hamad Sajad Mughal"}
]

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hermes = "hermes.__main__:main"
